name: Train Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "10"
      batch_size:
        description: "Training batch size"
        required: false
        default: "16"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "2e-5"
      hub_model_id:
        description: "HuggingFace Hub model ID to push to (leave empty to skip)"
        required: false
        default: ""

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare dataset
        run: |
          echo "Download the dataset manually from:"
          echo "https://data.mendeley.com/datasets/t8rtzcgwxm/3"
          echo ""
          echo "Then organize into: data/no_pain/, data/moderate_pain/, data/severe_pain/"
          echo "Or provide data/images/ + data/labels.csv"
          echo ""
          echo "For automated download, set up the Mendeley API integration."
          python -c "from equine_pain.dataset import download_dataset; download_dataset('data')" || true

      - name: Train model
        run: |
          python -m equine_pain.train \
            --data-dir data \
            --output-dir models \
            --epochs ${{ github.event.inputs.epochs }} \
            --batch-size ${{ github.event.inputs.batch_size }} \
            --learning-rate ${{ github.event.inputs.learning_rate }} \
            ${{ github.event.inputs.hub_model_id && format('--push-to-hub {0}', github.event.inputs.hub_model_id) || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/best_model/
          retention-days: 30
          if-no-files-found: warn
